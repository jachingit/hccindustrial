<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金屬表面處理流程</title>
    <link rel="stylesheet" href="./demo3d.css" />
  </head>
  <body>
    <!-- Three.js Canvas -->
    <canvas class="webgl"></canvas>

    <!-- Main section -->
    <div class="ui-container">
      <!-- Top Left Company Logo Section -->
      <header class="header-section">
        <div class="company-logo">
          <a
            href="./index.html"
            class="company-logo"
            style="text-decoration: none; color: inherit"
          >
            <svg class="logo-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path
                d="M0 0 C 30 0, 50 20, 50 50 C 20 50, 0 30, 0 0 Z"
                fill="currentColor"
              />
              <path
                d="M100 0 C 70 0, 50 20, 50 50 C 80 50, 100 30, 100 0 Z"
                fill="currentColor"
              />
              <path
                d="M0 100 C 30 100, 50 80, 50 50 C 20 50, 0 70, 0 100 Z"
                fill="currentColor"
              />
              <path
                d="M100 100 C 70 100, 50 80, 50 50 C 80 50, 100 70, 100 100 Z"
                fill="currentColor"
              />
              <circle cx="50" cy="50" r="14" fill="currentColor" />
            </svg>
            <span class="company-name">興建詮有限公司</span>
          </a>
        </div>
      </header>

      <footer class="footer-section">
        <h1 class="main-title">金屬表面處理流程</h1>
        <!-- Bottom Stage Navigation Pill Group -->
        <nav class="nav-bar">
          <button
            class="nav-item play-btn active"
            data-action="play"
            aria-label="播放 / 繼續循環"
            title="播放 / 繼續循環"
          >
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="5,3 19,12 5,21" fill="currentColor" />
            </svg>
          </button>
          <button class="nav-item" data-stage="0">帶鏽鋼材</button>
          <button class="nav-item" data-stage="1">酸洗除鏽</button>
          <button class="nav-item" data-stage="2">純淨金屬</button>
          <button class="nav-item" data-stage="3">電鍍處理</button>
          <button class="nav-item" data-stage="4">防鏽鋅膜</button>
        </nav>
      </footer>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
